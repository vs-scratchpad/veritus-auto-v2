site:
  name: Veritus
  site: 'https://vs-scratchpad.github.io'
  base: '/veritus-auto-v2'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: Veritus Automation
    template: '%s — Veritus Automation'
  description: 'AI automation systems, custom software projects, and automated pipeline solutions for business teams.'
  robots:
    index: false
    follow: false
  openGraph:
    site_name: Veritus Automation
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@veritusauto'
    site: '@veritusauto'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: false
        follow: false

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: false
        follow: false

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: false
        follow: false

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light'
